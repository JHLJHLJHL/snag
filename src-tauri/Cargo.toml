[package]
name = "snag"
version = "0.1.0"
edition = "2021"
description = "Public web video download manager"

[lib]
name = "streamdrop_core"
path = "src/lib.rs"

[[bin]]
name = "snag"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:rfd", "dep:tauri-plugin-single-instance", "dep:tauri-build", "dep:dunce", "dep:windows", "dep:webview2-com"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "sync", "io-util", "time", "macros"] }
async-trait = "0.1"
tiny_http = "0.12"
tauri = { version = "2", optional = true, features = [] }
tauri-plugin-single-instance = { version = "2", optional = true }
rfd = { version = "0.17", optional = true }
dunce = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"], optional = true }
webview2-com = { version = "=0.39.1", optional = true }

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dev-dependencies]
tempfile = "3"
